name: daily-wallpaper
base: core24
version: '1.1.1'
summary: A new Unsplash wallpaper every day
description: |
  Daily Wallpaper fetches a photo from Unsplash once a day and sets it as your
  GNOME wallpaper.

  * Search terms or collections decide what kind of photos you get
  * Images are downloaded to match your monitor resolution
  * History of recent wallpapers, one click puts an old one back
  * The time of the daily change is configurable
  * Old images are cleaned up automatically
  * Available in English and German

  Open the app once after installing: that sets up the daily change and
  fetches the first image right away.

  Unsplash search needs a free access key from
  https://unsplash.com/oauth/applications, entered in the settings. Without a
  key, images come from Lorem Picsum instead.

  Not affiliated with Unsplash Inc.

title: Daily Wallpaper
license: MIT
website: https://github.com/Dav2070/daily-wallpaper
source-code: https://github.com/Dav2070/daily-wallpaper
issues: https://github.com/Dav2070/daily-wallpaper/issues
contact: https://github.com/Dav2070/daily-wallpaper/issues
grade: stable
confinement: strict
compression: lzo

platforms:
  amd64:
  arm64:

# GTK, libadwaita, die Typelibs und PyGObject kommen aus der GNOME-Plattform
# ($SNAP_DESKTOP_RUNTIME). Ohne diese beiden Variablen findet das python3 sie
# nicht. Eigene Kopien mitzuliefern führte zu einem Versionskonflikt: die
# GTK-Module der Plattform erwarten ein neueres GTK als Ubuntu 24.04 liefert.
environment:
  PYTHONPATH: $SNAP_DESKTOP_RUNTIME/usr/lib/python3/dist-packages
  GI_TYPELIB_PATH: $SNAP_DESKTOP_RUNTIME/usr/lib/x86_64-linux-gnu/girepository-1.0:$SNAP_DESKTOP_RUNTIME/usr/lib/aarch64-linux-gnu/girepository-1.0

parts:
  daily-wallpaper:
    plugin: dump
    source: .
    organize:
      daily-wallpaper.py: bin/daily-wallpaper
      daily-wallpaper-gui.py: bin/daily-wallpaper-gui
      icons/de.zurek.UnsplashWallpaper.svg: usr/share/icons/hicolor/scalable/apps/daily-wallpaper.svg
      icons/de.zurek.UnsplashWallpaper-symbolic.svg: usr/share/icons/hicolor/symbolic/apps/daily-wallpaper-symbolic.svg
    # Übersetzungen kompilieren. tools/i18n.py kommt ohne gettext-Paket aus,
    # deshalb braucht der Bau keine zusätzlichen build-packages.
    override-build: |
      craftctl default
      python3 "${CRAFT_PART_SRC}/tools/i18n.py" compile \
        --po-dir "${CRAFT_PART_SRC}/po" \
        --output "${CRAFT_PART_INSTALL}/usr/share/locale"
    stage:
      - bin
      - usr
    prime:
      - bin
      - usr

apps:
  # Grafische Oberfläche
  daily-wallpaper:
    command: bin/daily-wallpaper-gui
    extensions: [gnome]
    common-id: de.zurek.UnsplashWallpaper
    plugs:
      - network
      - home

  # Kommandozeile: einmaliger Wechsel, Status
  cli:
    command: bin/daily-wallpaper
    extensions: [gnome]
    plugs:
      - network
      - home

  # Hintergrunddienst, startet bei der Anmeldung und wechselt täglich.
  # Kein systemd-Timer: Snaps dürfen keine Units ins Home schreiben, und
  # "daemon-scope: user" ist in snapd standardmäßig abgeschaltet.
  watcher:
    command: bin/daily-wallpaper --watch
    extensions: [gnome]
    autostart: daily-wallpaper-watcher.desktop
    plugs:
      - network
      - home
